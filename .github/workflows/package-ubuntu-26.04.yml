name: Micropolis package CI - Ubuntu 26.04

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to package
        required: true
        default: integration/linux-modern-fixes
        type: string
      packaging_ref:
        description: Ref providing micropolis-activity/debian
        required: true
        default: packaging/debian-modern
        type: string

permissions:
  contents: read

concurrency:
  group: micropolis-package-ubuntu-26.04-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Micropolis on Ubuntu 26.04
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Bootstrap Ubuntu 26.04 container
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            ca-certificates \
            git \
            dpkg-dev

      - name: Check out requested Micropolis source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Check out Debian packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.packaging_ref }}
          path: packaging
          persist-credentials: false
          sparse-checkout: |
            micropolis-activity/debian
          sparse-checkout-cone-mode: false

      - name: Overlay exact Debian packaging onto source checkout
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/packaging"
          test -z "$(git -C source status --porcelain)"
          test -d packaging/micropolis-activity/debian

          source_sha="$(git -C source rev-parse HEAD)"
          packaging_sha="$(git -C packaging rev-parse HEAD)"

          rm -rf source/micropolis-activity/debian
          cp -a packaging/micropolis-activity/debian source/micropolis-activity/debian
          diff -qr packaging/micropolis-activity/debian source/micropolis-activity/debian

          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "PACKAGING_SHA=$packaging_sha" >> "$GITHUB_ENV"

          echo "Requested source ref: ${{ inputs.source_ref }}"
          echo "Resolved source SHA: $source_sha"
          echo "Requested packaging ref: ${{ inputs.packaging_ref }}"
          echo "Resolved packaging SHA: $packaging_sha"

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== operating system ==="
          cat /etc/os-release
          echo
          echo "=== architecture ==="
          dpkg --print-architecture
          echo
          echo "=== kernel ==="
          uname -a
          echo
          echo "=== CPUs ==="
          nproc
          echo
          echo "=== disk ==="
          df -h "$GITHUB_WORKSPACE"
          echo
          echo "=== Micropolis source ==="
          echo "ref: ${{ inputs.source_ref }}"
          echo "sha: $SOURCE_SHA"
          echo
          echo "=== Debian packaging ==="
          echo "ref: ${{ inputs.packaging_ref }}"
          echo "sha: $PACKAGING_SHA"
          echo "version: $(dpkg-parsechangelog -lsource/micropolis-activity/debian/changelog -S Version)"

      - name: Install Debian package build tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            fakeroot

      - name: Install Micropolis build dependencies
        shell: bash
        working-directory: source/micropolis-activity
        run: |
          set -Eeuo pipefail
          mk-build-deps \
            --install \
            --remove \
            --tool 'apt-get -y -o Acquire::Retries=3 --no-install-recommends' \
            debian/control
          dpkg-checkbuilddeps

      - name: Build Micropolis binary packages
        shell: bash
        working-directory: source/micropolis-activity
        run: |
          set -Eeuo pipefail
          dpkg-buildpackage -b -us -uc 2>&1 | tee "$GITHUB_WORKSPACE/dpkg-buildpackage.log"

      - name: Upload package build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: micropolis-build-log-ubuntu-26.04-${{ github.run_id }}
          path: dpkg-buildpackage.log
          if-no-files-found: error
          retention-days: 30

      - name: Collect and inspect package artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p out
          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 1 \
            -type f \
            \( -name '*.deb' -o -name '*.ddeb' -o -name '*.changes' -o -name '*.buildinfo' \) \
            -exec cp -v '{}' out/ ';'

          shopt -s nullglob
          program_debs=(out/micropolis_*_amd64.deb)
          data_debs=(out/micropolis-data_*_all.deb)

          if (( ${#program_debs[@]} != 1 )); then
              echo "ERROR: expected exactly one micropolis amd64 .deb" >&2
              printf 'found: %s\n' "${program_debs[@]:-none}" >&2
              exit 1
          fi
          if (( ${#data_debs[@]} != 1 )); then
              echo "ERROR: expected exactly one micropolis-data all .deb" >&2
              printf 'found: %s\n' "${data_debs[@]:-none}" >&2
              exit 1
          fi

          echo "=== generated artifacts ==="
          find out -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          dpkg-deb --info "${program_debs[0]}"
          dpkg-deb --info "${data_debs[0]}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: micropolis-ubuntu-26.04-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  test-install:
    name: Install-test Micropolis on clean Ubuntu 26.04
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 30

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Bootstrap Ubuntu 26.04 container
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: micropolis-ubuntu-26.04-${{ github.run_id }}
          path: artifact

      - name: Inspect downloaded packages
        shell: bash
        run: |
          set -Eeuo pipefail
          find artifact -maxdepth 1 -type f -printf '%f\n' | sort

          shopt -s nullglob
          program_debs=(artifact/micropolis_*_amd64.deb)
          data_debs=(artifact/micropolis-data_*_all.deb)
          if (( ${#program_debs[@]} != 1 || ${#data_debs[@]} != 1 )); then
              echo "ERROR: package artifact set is incomplete or ambiguous" >&2
              exit 1
          fi
          dpkg-deb --info "${program_debs[0]}"
          dpkg-deb --info "${data_debs[0]}"

      - name: Install packages on clean Ubuntu 26.04
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          program_debs=(./artifact/micropolis_*_amd64.deb)
          data_debs=(./artifact/micropolis-data_*_all.deb)

          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            "${data_debs[0]}" \
            "${program_debs[0]}" \
            xvfb \
            xauth

          dpkg-query -W \
            -f='${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Status}\n' \
            micropolis micropolis-data
          apt-get check

          audit="$(dpkg --audit)"
          if [ -n "$audit" ]; then
              printf '%s\n' "$audit" >&2
              exit 1
          fi
          dpkg -V micropolis micropolis-data

      - name: Runtime smoke test under Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e
          timeout 8s xvfb-run -a /usr/games/micropolis >/tmp/micropolis.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 124 ]; then
              cat /tmp/micropolis.log
              echo "ERROR: Micropolis exited unexpectedly with status $status" >&2
              exit 1
          fi
